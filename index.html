<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shelterz</title>
    <style>
      body { margin: 0; background: #0c0c0f; overflow: hidden }
      canvas { display: block }
      #overlay { position: fixed; inset: 0; pointer-events: none }
      #hud {
        position: fixed; left: 8px; bottom: 8px;
        font: 12px/1.4 ui-monospace, monospace; color: #8a93a0;
        text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre;
      }
      #chronicle {
        position: fixed; left: 8px; bottom: 46px;
        font: 8px/1.5 "Courier New", Courier, monospace; color: #64dc82;
        letter-spacing: 0.03em;
        text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      #chronicle div { pointer-events: auto; cursor: pointer }
      #chronicle div:hover { color: #fff; background: rgba(0, 0, 0, 0.92); outline: 3px solid rgba(0, 0, 0, 0.92) }
      #probe {
        position: fixed; display: none; z-index: 5;
        font: 11px/1.45 ui-monospace, monospace; color: #d8dce2;
        background: rgba(9, 11, 16, 0.88); border: 1px solid #3a4048;
        padding: 6px 9px; pointer-events: none; white-space: pre;
      }
      #lull {
        position: fixed; right: 10px; top: 8px; z-index: 6;
        font: 11px/1.4 ui-monospace, monospace; color: #8a93a0; text-shadow: 0 1px 2px #000;
        pointer-events: auto;
      }
      #lull input[type="range"] { width: 108px; accent-color: #6a7280; display: block }
      #lull label { display: block; margin-top: 3px; cursor: pointer }
      #lull input[type="checkbox"] { accent-color: #6a7280; vertical-align: middle }
      #story { position: fixed; right: 10px; top: 66px; z-index: 6; font: 12px/1.3 ui-monospace, monospace }
      #story button {
        font: inherit; color: #cfd4da; background: rgba(9, 11, 16, 0.88);
        border: 1px solid #3a4048; padding: 4px 9px; cursor: pointer; text-align: left;
      }
      #story button:hover { color: #fff; border-color: #6a7280 }
      #story .popper {
        position: absolute; top: 30px; right: 0; min-width: 118px;
        display: flex; flex-direction: column; gap: 3px;
        background: rgba(9, 11, 16, 0.92); border: 1px solid #3a4048; padding: 6px;
      }
      #story .popper .title { color: #8a93a0; padding: 1px 2px }
    </style>
    <script type="module" crossorigin src="./assets/index-DvHPivj-.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="overlay"></canvas>
    <div id="chronicle"></div>
    <div id="probe"></div>
    <div id="hud"></div>
    <div id="story"></div>
    <div id="lull"></div>
  </body>
</html>
